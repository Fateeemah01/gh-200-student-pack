name: Label PRs
on: pull_request_target
permissions: write-all
jobs:
  label:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm install && npm test
      - run: echo "Labelling ${{ github.head_ref }}"
      - uses: some-org/add-labels@main
